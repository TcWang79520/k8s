apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helloworld-ingress
  namespace: default
spec:
  rules:
  - host: helloworld.example.com
    http:
      paths:
      - path: /                # 👈 補上根路徑
        pathType: Prefix       # 👈 新版必填欄位 (Prefix 代表字首比對)
        backend:
          service:             # 👈 結構改為 service 物件
            name: helloworld-service
            port:
              number: 3000     # 👈 改為 port.number