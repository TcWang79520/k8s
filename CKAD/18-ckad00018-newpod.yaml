# 這題唯一該修改的物件：ckad00018-newpod
# db、front 各自有一條 NetworkPolicy，只放行帶有 db-access=true / front-access=true
# 標籤的對象，所以 newpod 要「兩個標籤都加」才能同時跟 db、front 收發流量。
# 不新建、不修改、不刪除任何 NetworkPolicy。
apiVersion: v1
kind: Pod
metadata:
  name: ckad00018-newpod
  namespace: ckad00018
  labels:
    front-access: "true"
    db-access: "true"
spec:
  containers:
  - name: nginx
    image: nginx:stable
