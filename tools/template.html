<!DOCTYPE html>
<html lang="zh-Hant" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
/* ============================================================
   Design tokens — semantic only, no raw hex inside components
   Light: warm paper ground, soft charcoal ink
   Dark : desaturated tonal variants (not inverted)
   ============================================================ */
:root{
  --bg:#f6f4f0; --surface:#fffefc; --surface-2:#f1ede6; --surface-3:#faf8f5;
  --border:#e6e0d6; --border-2:#d5cec1;
  --text:#2c3138; --text-2:#58606b; --text-3:#696f79;
  --accent:#2f6f66; --accent-ink:#255a52; --accent-soft:#e3efec;
  --sel:#dbeae6;
  --c-task-bg:#e7edf6; --c-task-fg:#35557f;
  --c-ref-bg:#eae7e0;  --c-ref-fg:#5a616c;
  --c-solve-bg:#e2efea; --c-solve-fg:#2b6a5a;
  --c-verify-bg:#e4eef2; --c-verify-fg:#316276;
  --c-domain-bg:#ece8f4; --c-domain-fg:#5c5086;
  --c-pitfall-bg:#f6ecdf; --c-pitfall-fg:#875a22;
  --c-quick-bg:#f0ece4; --c-quick-fg:#665c4d;
  --c-note-bg:#eceae5;  --c-note-fg:#5a616c;
  --c-plain-bg:#eae8e3; --c-plain-fg:#545b66;
  --c-debug-bg:#f2e9e6; --c-debug-fg:#8a5344;
  --t-c:#626a76; --t-s:#8a5a34; --t-k:#2f6f66; --t-f:#5c5086;
  --t-n:#875a22; --t-key:#35557f; --t-p:#636a75; --t-v:#454c56;
  --shadow-1:0 1px 2px rgba(44,49,56,.05), 0 1px 3px rgba(44,49,56,.04);
  --shadow-2:0 2px 8px rgba(44,49,56,.07), 0 1px 3px rgba(44,49,56,.05);
  --r-s:6px; --r-m:10px; --r-l:14px;
  --sbw:282px;
  --fast:160ms; --mid:220ms; --ease:cubic-bezier(.2,.7,.3,1);
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#1a1c1f; --surface:#212428; --surface-2:#282c31; --surface-3:#1f2226;
  --border:#33373d; --border-2:#434850;
  --text:#dfddd8; --text-2:#a9afb7; --text-3:#8a9099;
  --accent:#83b8ae; --accent-ink:#9ac9c0; --accent-soft:#22322f;
  --sel:#2b423d;
  --c-task-bg:#232c3a; --c-task-fg:#9fbde3;
  --c-ref-bg:#2a2c30;  --c-ref-fg:#adb3bb;
  --c-solve-bg:#213330; --c-solve-fg:#8ec7b8;
  --c-verify-bg:#213036; --c-verify-fg:#94bfd0;
  --c-domain-bg:#2a2735; --c-domain-fg:#b3a7d8;
  --c-pitfall-bg:#332b21; --c-pitfall-fg:#d5a874;
  --c-quick-bg:#2b2925; --c-quick-fg:#c3b9a6;
  --c-note-bg:#292b2e;  --c-note-fg:#adb3bb;
  --c-plain-bg:#2a2c30; --c-plain-fg:#b0b6be;
  --c-debug-bg:#332826; --c-debug-fg:#d3a294;
  --t-c:#8d95a0; --t-s:#c99a6b; --t-k:#83b8ae; --t-f:#b3a7d8;
  --t-n:#d3a76b; --t-key:#8fb2de; --t-p:#8e959d; --t-v:#c4c8ce;
  --shadow-1:0 1px 2px rgba(0,0,0,.3); --shadow-2:0 2px 10px rgba(0,0,0,.35);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  html[data-theme="auto"]{
    --bg:#1a1c1f; --surface:#212428; --surface-2:#282c31; --surface-3:#1f2226;
    --border:#33373d; --border-2:#434850;
    --text:#dfddd8; --text-2:#a9afb7; --text-3:#8a9099;
    --accent:#83b8ae; --accent-ink:#9ac9c0; --accent-soft:#22322f;
    --sel:#2b423d;
    --c-task-bg:#232c3a; --c-task-fg:#9fbde3;
    --c-ref-bg:#2a2c30;  --c-ref-fg:#adb3bb;
    --c-solve-bg:#213330; --c-solve-fg:#8ec7b8;
    --c-verify-bg:#213036; --c-verify-fg:#94bfd0;
    --c-domain-bg:#2a2735; --c-domain-fg:#b3a7d8;
    --c-pitfall-bg:#332b21; --c-pitfall-fg:#d5a874;
    --c-quick-bg:#2b2925; --c-quick-fg:#c3b9a6;
    --c-note-bg:#292b2e;  --c-note-fg:#adb3bb;
    --c-plain-bg:#2a2c30; --c-plain-fg:#b0b6be;
    --c-debug-bg:#332826; --c-debug-fg:#d3a294;
    --t-c:#8d95a0; --t-s:#c99a6b; --t-k:#83b8ae; --t-f:#b3a7d8;
    --t-n:#d3a76b; --t-key:#8fb2de; --t-p:#8e959d; --t-v:#c4c8ce;
    --shadow-1:0 1px 2px rgba(0,0,0,.3); --shadow-2:0 2px 10px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:system-ui,"Segoe UI","Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  font-size:16.5px; line-height:1.85;
  font-feature-settings:"tnum" 0;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--sel)}
code,pre,kbd,.mono{font-family:"Cascadia Mono",Consolas,"JetBrains Mono",ui-monospace,"Courier New",monospace}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}

/* ---------------- shell ---------------- */
.shell{display:grid; grid-template-columns:var(--sbw) minmax(0,1fr); min-height:100vh}

/* ---------------- sidebar ---------------- */
.side{
  position:fixed; inset:0 auto 0 0; width:var(--sbw); z-index:40;
  background:var(--surface-3); border-right:1px solid var(--border);
  display:flex; flex-direction:column;
}
.side-top{padding:18px 16px 12px; border-bottom:1px solid var(--border)}
.brand{display:flex; align-items:center; gap:9px; margin:0 0 13px; font-size:.94rem; font-weight:650; color:var(--text)}
.brand svg{width:19px; height:19px; flex:none; fill:none; stroke:var(--accent); stroke-width:1.6; stroke-linejoin:round; stroke-linecap:round}
.search{position:relative}
.search svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:15px; height:15px;
  fill:none; stroke:var(--text-3); stroke-width:1.9; stroke-linecap:round; pointer-events:none}
#q{
  width:100%; padding:8px 10px 8px 31px; font:inherit; font-size:.86rem; line-height:1.4;
  color:var(--text); background:var(--surface); border:1px solid var(--border-2);
  border-radius:var(--r-s); transition:border-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease);
}
#q::placeholder{color:var(--text-3)}
#q:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.kbd{position:absolute; right:8px; top:50%; transform:translateY(-50%); font-size:.7rem;
  color:var(--text-3); border:1px solid var(--border-2); border-radius:4px; padding:1px 5px; background:var(--surface-2)}
#q:focus ~ .kbd{opacity:0}

.nav{flex:1; overflow-y:auto; overscroll-behavior:contain; padding:10px 10px 28px}
.nav-h{font-size:.7rem; letter-spacing:.09em; text-transform:uppercase; color:var(--text-3);
  padding:10px 8px 6px; font-weight:600}
.nav-grp{margin-bottom:6px}
.nav-grp[hidden]{display:none}
.nav-g{
  display:flex; align-items:center; gap:8px; margin:12px 0 5px; padding:5px 9px;
  border-radius:var(--r-s); text-decoration:none;
  font-size:.715rem; letter-spacing:.07em; font-weight:700; color:var(--text-3);
  border-bottom:1px solid var(--border);
  transition:color var(--fast) var(--ease), background var(--fast) var(--ease);
}
.nav-grp:first-child .nav-g{margin-top:2px}
.nav-g:hover{color:var(--accent-ink); background:var(--surface-2)}
.nav-g-t{flex:1; min-width:0}
.nav-g-n{
  flex:none; font-variant-numeric:tabular-nums; font-weight:650; font-size:.7rem;
  color:var(--text-3); background:var(--surface-2); border:1px solid var(--border);
  border-radius:99px; padding:0 6px; line-height:1.55;
}
.nv{
  display:flex; align-items:flex-start; gap:9px; padding:6px 9px; margin-bottom:1px;
  border-radius:var(--r-s); color:var(--text-2); text-decoration:none; font-size:.855rem; line-height:1.5;
  transition:background var(--fast) var(--ease), color var(--fast) var(--ease);
}
.nv:hover{background:var(--surface-2); color:var(--text)}
.nv .n{
  flex:none; width:22px; height:22px; margin-top:1px; border-radius:5px;
  display:grid; place-items:center; font-size:.72rem; font-weight:650;
  font-variant-numeric:tabular-nums;
  background:var(--surface-2); color:var(--text-3); border:1px solid var(--border);
}
.nv .n-k{color:var(--accent); background:var(--accent-soft); border-color:transparent}
.nv3{padding-left:40px; font-size:.82rem; color:var(--text-3)}
.nv.on{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
.nv.on .n{background:var(--accent); color:#fff; border-color:transparent}
html[data-theme="dark"] .nv.on .n{color:#15201e}
.nv[hidden]{display:none}
.nav-empty{padding:14px 10px; font-size:.83rem; color:var(--text-3)}

.side-foot{padding:10px 14px; border-top:1px solid var(--border); display:flex; gap:8px; align-items:center}
.tbtn{
  display:inline-flex; align-items:center; gap:7px; padding:6px 11px; min-height:34px;
  font:inherit; font-size:.8rem; color:var(--text-2); cursor:pointer;
  background:var(--surface); border:1px solid var(--border-2); border-radius:var(--r-s);
  transition:background var(--fast) var(--ease), color var(--fast) var(--ease), border-color var(--fast) var(--ease);
}
.tbtn:hover{background:var(--surface-2); color:var(--text)}
.tbtn svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}

/* ---------------- main ---------------- */
.main{grid-column:2; min-width:0}
.topbar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px;
  padding:0 24px; height:50px;
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(8px);
  border-bottom:1px solid var(--border);
}
.crumb{font-size:.83rem; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.crumb b{color:var(--text); font-weight:600}
.menu{display:none}
.wrap{max-width:952px; margin:0 auto; padding:34px 24px 120px}

/* ---------------- hero ---------------- */
.hero{margin-bottom:30px}
.hero h1{margin:0 0 12px; font-size:1.92rem; line-height:1.35; letter-spacing:-.01em; font-weight:700}
.hero .lede{margin:0 0 18px; color:var(--text-2); font-size:.98rem; max-width:62ch}
.stats{display:flex; flex-wrap:wrap; gap:8px}
.stat{
  display:inline-flex; align-items:baseline; gap:6px; padding:5px 12px;
  background:var(--surface); border:1px solid var(--border); border-radius:99px;
  font-size:.82rem; color:var(--text-2);
}
.stat b{font-size:.95rem; color:var(--text); font-weight:650; font-variant-numeric:tabular-nums}

/* ---------------- 考綱分類總覽 ---------------- */
.ovw{margin:0 0 8px; scroll-margin-top:66px}
.ovw-h{
  display:flex; align-items:center; gap:10px; margin:0 0 8px;
  font-size:.76rem; letter-spacing:.09em; text-transform:uppercase;
  color:var(--text-3); font-weight:650;
}
.ovw-h::after{content:""; flex:1; height:1px; background:var(--border)}
.ovw-lede{margin:0 0 16px; color:var(--text-2); font-size:.89rem; max-width:68ch}
.dom{
  margin:0 0 10px; padding:16px 18px 15px; scroll-margin-top:66px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-l);
  box-shadow:var(--shadow-1);
}
.dom-h{display:flex; align-items:center; gap:13px}
.dom-w{
  flex:none; width:52px; height:44px; border-radius:var(--r-m);
  display:flex; align-items:baseline; justify-content:center; gap:1px;
  background:var(--accent-soft); color:var(--accent-ink);
}
.dom-w b{font-size:1.12rem; font-weight:700; font-variant-numeric:tabular-nums; line-height:1}
.dom-w i{font-style:normal; font-size:.7rem; font-weight:650}
.dom-name{flex:1; min-width:0; display:flex; flex-direction:column}
.dom-zh{font-size:1.02rem; font-weight:680; color:var(--text); line-height:1.4}
.dom-en{font-size:.735rem; color:var(--text-3); line-height:1.45; letter-spacing:.01em}
.dom-n{
  flex:none; font-size:.75rem; color:var(--text-3); font-variant-numeric:tabular-nums;
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:99px; padding:2px 10px;
}
.dom-desc{margin:9px 0 11px; font-size:.825rem; color:var(--text-2); line-height:1.7}
.qrefs{display:flex; flex-wrap:wrap; gap:6px}
.qref{
  display:inline-flex; align-items:center; gap:7px; max-width:100%;
  padding:5px 10px 5px 6px; border-radius:99px; text-decoration:none;
  background:var(--surface-3); border:1px solid var(--border);
  color:var(--text-2); font-size:.815rem; line-height:1.5;
  transition:border-color var(--fast) var(--ease), color var(--fast) var(--ease),
             background var(--fast) var(--ease);
}
.qref:hover{border-color:var(--accent); color:var(--text); background:var(--surface)}
.qref-n{
  flex:none; min-width:20px; height:20px; padding:0 5px; border-radius:99px;
  display:grid; place-items:center; font-size:.71rem; font-weight:700;
  font-variant-numeric:tabular-nums;
  background:var(--surface-2); color:var(--text-3); border:1px solid var(--border);
}
.qref:hover .qref-n{background:var(--accent); color:#fff; border-color:transparent}
html[data-theme="dark"] .qref:hover .qref-n{color:#15201e}
.qref-t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:46ch}
.qref-s{
  flex:none; font-size:.68rem; color:var(--text-3); letter-spacing:.03em;
  padding-left:7px; border-left:1px solid var(--border-2);
}

/* ---------------- group header (one per source document) ---------------- */
.grp{
  margin:46px 0 20px; padding:20px 24px 22px; scroll-margin-top:66px;
  background:var(--accent-soft); border:1px solid var(--border); border-radius:var(--r-l);
}
.grp:first-of-type{margin-top:8px}
.grp-kicker{
  margin:0 0 4px; font-size:.71rem; letter-spacing:.1em; text-transform:uppercase;
  color:var(--accent-ink); font-weight:700;
}
.grp-h{margin:0 0 10px; font-size:1.42rem; line-height:1.4; font-weight:700; letter-spacing:-.01em}
.grp-lede{margin:0 0 8px; color:var(--text-2); font-size:.9rem; max-width:70ch}
.grp-src{margin:0 0 16px; font-size:.78rem; color:var(--text-3)}
.grp-src code{background:var(--surface); font-size:.95em}

/* ---------------- index grid ---------------- */
.idx{margin:0 0 44px}
.idx-h{display:flex; align-items:center; gap:10px; margin:0 0 14px; font-size:.76rem;
  letter-spacing:.09em; text-transform:uppercase; color:var(--text-3); font-weight:650}
.idx-h::after{content:""; flex:1; height:1px; background:var(--border)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:9px}
.card{
  display:flex; align-items:flex-start; gap:10px; padding:11px 13px; min-height:52px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-m);
  color:var(--text-2); text-decoration:none; font-size:.86rem; line-height:1.5;
  box-shadow:var(--shadow-1);
  transition:border-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease), color var(--fast) var(--ease);
}
.card:hover{border-color:var(--accent); color:var(--text); box-shadow:var(--shadow-2)}
.card-n{
  flex:none; width:24px; height:24px; border-radius:6px; display:grid; place-items:center;
  font-size:.76rem; font-weight:650; font-variant-numeric:tabular-nums;
  background:var(--surface-2); color:var(--text-3); border:1px solid var(--border);
}
.card:hover .card-n{background:var(--accent); color:#fff; border-color:transparent}
html[data-theme="dark"] .card:hover .card-n{color:#15201e}
.card-k .card-n{background:var(--accent-soft); color:var(--accent); border-color:transparent}

/* ---------------- section ---------------- */
.sec{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-l);
  padding:24px 28px 26px; margin:0 0 22px; scroll-margin-top:66px;
  box-shadow:var(--shadow-1);
}
.sec-h{
  display:flex; align-items:flex-start; gap:13px; margin:0 0 20px;
  padding-bottom:16px; border-bottom:1px solid var(--border);
  font-size:1.3rem; line-height:1.45; font-weight:680; letter-spacing:-.005em;
}
.qnum{
  flex:none; width:30px; height:30px; margin-top:2px; border-radius:8px; display:grid; place-items:center;
  background:var(--accent); color:#fff; font-size:.86rem; font-weight:700; font-variant-numeric:tabular-nums;
}
html[data-theme="dark"] .qnum{color:#15201e}
.qnum-k{background:var(--accent-soft)}
.qnum-k svg{width:17px; height:17px; fill:none; stroke:var(--accent); stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round}
.sec-t{flex:1; min-width:0}
.anchor{
  flex:none; margin-top:4px; color:var(--text-3); text-decoration:none; font-size:.9rem;
  opacity:0; transition:opacity var(--fast) var(--ease), color var(--fast) var(--ease);
}
.sec-h:hover .anchor,h3:hover .anchor,.anchor:focus-visible{opacity:1}
.anchor:hover{color:var(--accent)}

h3{
  display:flex; align-items:baseline; gap:9px; margin:32px 0 14px; scroll-margin-top:66px;
  font-size:1.04rem; font-weight:670; line-height:1.55;
  padding-left:12px; border-left:3px solid var(--accent);
}
.sec > h3:first-of-type{margin-top:4px}

/* ---------------- labelled blocks ---------------- */
.blk{margin:0 0 18px; padding-left:14px; border-left:2px solid var(--border)}
.blk:last-child{margin-bottom:0}
.blk-h{margin:0 0 9px !important}
.chip{
  display:inline-block; padding:3px 10px; border-radius:99px;
  font-size:.745rem; font-weight:680; letter-spacing:.03em; line-height:1.6;
  background:var(--c-plain-bg); color:var(--c-plain-fg);
}
.blk-task{border-left-color:var(--c-task-fg)}    .chip-task{background:var(--c-task-bg); color:var(--c-task-fg)}
.blk-ref{border-left-color:var(--border-2)}      .chip-ref{background:var(--c-ref-bg); color:var(--c-ref-fg)}
.blk-solve{border-left-color:var(--c-solve-fg)}  .chip-solve{background:var(--c-solve-bg); color:var(--c-solve-fg)}
.blk-verify{border-left-color:var(--c-verify-fg)}.chip-verify{background:var(--c-verify-bg); color:var(--c-verify-fg)}
.blk-domain{border-left-color:var(--c-domain-fg)}.chip-domain{background:var(--c-domain-bg); color:var(--c-domain-fg)}
.blk-pitfall{border-left-color:var(--c-pitfall-fg)}.chip-pitfall{background:var(--c-pitfall-bg); color:var(--c-pitfall-fg)}
.blk-quick{border-left-color:var(--c-quick-fg)}  .chip-quick{background:var(--c-quick-bg); color:var(--c-quick-fg)}
.blk-note{border-left-color:var(--border-2)}     .chip-note{background:var(--c-note-bg); color:var(--c-note-fg)}
.blk-debug{border-left-color:var(--c-debug-fg)}  .chip-debug{background:var(--c-debug-bg); color:var(--c-debug-fg)}
.blk-quick{background:var(--surface-3); border-radius:0 var(--r-m) var(--r-m) 0; padding:14px 16px 4px 14px}

.step{
  margin:22px 0 10px; font-weight:660; color:var(--text); font-size:.96rem;
  padding-left:11px; border-left:3px solid var(--border-2);
}

/* ---------------- CKAD/ file panels ---------------- */
.files{margin:14px 0 2px}
.files-h{
  margin:0 0 8px !important; font-size:.73rem; letter-spacing:.05em;
  color:var(--text-3); font-weight:650;
}
details.file{
  margin:0 0 6px; background:var(--surface-3);
  border:1px solid var(--border); border-radius:var(--r-m); overflow:hidden;
}
details.file[open]{background:var(--surface)}
details.file > summary{
  display:flex; align-items:center; gap:8px; padding:9px 12px; min-height:42px;
  cursor:pointer; list-style:none; font-size:.855rem; color:var(--text-2);
  transition:background var(--fast) var(--ease), color var(--fast) var(--ease);
}
details.file > summary::-webkit-details-marker{display:none}
details.file > summary:hover{background:var(--surface-2); color:var(--text)}
details.file > summary:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.chev,.fico{flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.chev{width:14px; height:14px; color:var(--text-3); transition:transform var(--fast) var(--ease)}
details.file[open] > summary .chev{transform:rotate(90deg)}
.fico{width:15px; height:15px; color:var(--accent)}
.fname{
  font-family:"Cascadia Mono",Consolas,"JetBrains Mono",ui-monospace,monospace;
  font-size:.83rem; color:var(--text); font-weight:600;
}
details.file[open] > summary .fname{color:var(--accent-ink)}
.fpath{font-size:.74rem; color:var(--text-3); margin-left:-4px}
.fmeta{
  margin-left:auto; flex:none; font-size:.72rem; color:var(--text-3);
  font-variant-numeric:tabular-nums; letter-spacing:.02em;
}
.fbody{padding:0 10px 10px; border-top:1px solid var(--border)}
.fbody figure.code{margin:10px 0 0; background:var(--surface-2)}

/* ---------------- prose ---------------- */
.sec p{margin:0 0 13px}
.sec p:last-child{margin-bottom:0}
.sec ul,.sec ol{margin:0 0 14px; padding-left:1.45em}
.sec li{margin:0 0 7px}
.sec li:last-child{margin-bottom:0}
.sec li::marker{color:var(--text-3)}
.sec ul ul,.sec ol ol,.sec ul ol,.sec ol ul{margin:7px 0 0}
/* nested blocks inside a list item */
.sec li > p{margin:0 0 8px}
.sec li > p:last-child{margin-bottom:0}
.sec li > figure.code,.sec li > .tw,.sec li > blockquote{margin:9px 0 11px}
.sec li > figure.code:last-child,.sec li > .tw:last-child,.sec li > blockquote:last-child{margin-bottom:2px}
hr{border:0; border-top:1px solid var(--border); margin:26px 0}

code{
  font-size:.855em; padding:.1em .38em; border-radius:4px;
  background:var(--surface-2); color:var(--accent-ink);
  border:1px solid var(--border); overflow-wrap:break-word;
}
html[data-theme="dark"] code{color:var(--accent-ink)}
a.lk{text-decoration-thickness:1px; text-underline-offset:2.5px}
a.lk:hover{color:var(--accent)}
a.lk code{color:inherit}
a.lk-file{color:var(--text-2); text-decoration-style:dotted}
a.lk-file:hover{color:var(--accent)}

blockquote{
  margin:0 0 16px; padding:12px 16px;
  background:var(--surface-3); border:1px solid var(--border);
  border-left:3px solid var(--border-2); border-radius:0 var(--r-s) var(--r-s) 0;
  color:var(--text-2); font-size:.94rem;
}
blockquote p:last-child{margin-bottom:0}

/* ---------------- tables ---------------- */
.tw{overflow-x:auto; margin:0 0 18px; border:1px solid var(--border); border-radius:var(--r-m); background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:.885rem; line-height:1.7}
th,td{padding:9px 13px; text-align:left; vertical-align:top; border-bottom:1px solid var(--border)}
th{background:var(--surface-2); font-weight:650; color:var(--text); white-space:nowrap; font-size:.83rem}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-3)}
td code{white-space:normal}

/* ---------------- code blocks ---------------- */
figure.code{
  margin:0 0 18px; background:var(--surface-2); border:1px solid var(--border);
  border-radius:var(--r-m); overflow:hidden;
}
figure.code figcaption{
  display:flex; align-items:center; justify-content:space-between;
  padding:5px 8px 5px 13px; border-bottom:1px solid var(--border); background:var(--surface-3);
}
.lang{font-size:.7rem; letter-spacing:.09em; text-transform:uppercase; color:var(--text-3); font-weight:650}
.copy{
  display:inline-flex; align-items:center; gap:5px; padding:4px 9px; min-height:28px;
  font:inherit; font-size:.74rem; color:var(--text-3); cursor:pointer;
  background:transparent; border:1px solid transparent; border-radius:var(--r-s);
  transition:background var(--fast) var(--ease), color var(--fast) var(--ease), border-color var(--fast) var(--ease);
}
.copy:hover{background:var(--surface); color:var(--text); border-color:var(--border)}
.copy svg{width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.copy.ok{color:var(--accent); border-color:transparent}
pre{
  margin:0; padding:14px 16px; overflow-x:auto;
  font-size:.83rem; line-height:1.75; tab-size:2;
}
pre code{background:none; border:0; padding:0; font-size:1em; color:var(--text); white-space:pre}
.t-c{color:var(--t-c); font-style:italic}
.t-s{color:var(--t-s)} .t-k{color:var(--t-k); font-weight:600} .t-f{color:var(--t-f)}
.t-n{color:var(--t-n)} .t-key{color:var(--t-key)} .t-p{color:var(--t-p)} .t-v{color:var(--t-v)}

/* ---------------- back to top ---------------- */
.top{
  position:fixed; right:24px; bottom:24px; z-index:35;
  width:40px; height:40px; display:grid; place-items:center; cursor:pointer;
  background:var(--surface); color:var(--text-2);
  border:1px solid var(--border-2); border-radius:50%; box-shadow:var(--shadow-2);
  opacity:0; visibility:hidden;
  transition:opacity var(--mid) var(--ease), visibility var(--mid) var(--ease), color var(--fast) var(--ease);
}
.top.on{opacity:1; visibility:visible}
.top:hover{color:var(--accent)}
.top svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}

/* ---------------- responsive ---------------- */
@media (max-width:1080px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .main{grid-column:1}
  .side{transform:translateX(-100%); transition:transform var(--mid) var(--ease); box-shadow:var(--shadow-2)}
  body.nav-open .side{transform:none}
  body.nav-open::after{content:""; position:fixed; inset:0; z-index:35; background:rgba(20,22,25,.45)}
  .menu{
    display:grid; place-items:center; width:34px; height:34px; flex:none; cursor:pointer;
    background:var(--surface); color:var(--text-2); border:1px solid var(--border-2); border-radius:var(--r-s);
  }
  .menu svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round}
  .wrap{padding:26px 18px 100px}
  .sec{padding:20px 18px 22px}
}
@media (max-width:560px){
  body{font-size:16px}
  .hero h1{font-size:1.55rem}
  .grid{grid-template-columns:1fr}
  .sec{border-radius:var(--r-m); padding:18px 15px 20px}
  .sec-h{font-size:1.15rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important; scroll-behavior:auto !important}
}
@media print{
  .side,.topbar,.top,.copy,.anchor{display:none !important}
  .shell{grid-template-columns:1fr} .main{grid-column:1}
  body{background:#fff; font-size:11pt}
  .sec{break-inside:auto; box-shadow:none; border-color:#ccc; page-break-inside:auto}
  .sec-h{break-after:avoid} figure.code,.tw{break-inside:avoid}
  .wrap{max-width:none; padding:0}
}
</style>
</head>
<body>
<div class="shell">

<aside class="side" id="side">
  <div class="side-top">
    <p class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>
      CKAD 練習記錄
    </p>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜尋題目…" autocomplete="off" aria-label="搜尋題目">
      <span class="kbd">/</span>
    </div>
  </div>
  <nav class="nav" id="nav" aria-label="題目導覽">
    <p class="nav-h">目錄</p>
    {{NAV}}
    <p class="nav-empty" id="noresult" hidden>找不到相符的題目</p>
  </nav>
  <div class="side-foot">
    <button class="tbtn" id="theme" type="button" aria-label="切換配色主題">
      <svg id="ticon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
      <span id="tlabel">跟隨系統</span>
    </button>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <button class="menu" id="menu" type="button" aria-label="開啟目錄" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <p class="crumb" id="crumb">{{TITLE}}</p>
  </div>

  <main class="wrap">
    <header class="hero">
      <h1>{{TITLE}}</h1>
      <p class="lede">{{INTRO}}</p>
      <div class="stats">
        {{STATS}}
      </div>
    </header>

    {{OVERVIEW}}

    {{CONTENT}}
  </main>
</div>
</div>

<button class="top" id="totop" type="button" aria-label="回到頂端">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script>
(function(){
  "use strict";
  var root=document.documentElement;

  /* ---- theme: auto -> light -> dark ---- */
  var MODES=[["auto","跟隨系統"],["light","淺色"],["dark","深色"]];
  var ICONS={
    auto:'<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>',
    light:'<circle cx="12" cy="12" r="4.6"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/>',
    dark:'<path d="M20 14.5A8.2 8.2 0 0 1 9.5 4 8.3 8.3 0 1 0 20 14.5z"/>'
  };
  var mode="auto";
  try{ mode=localStorage.getItem("ckad-theme")||"auto"; }catch(e){}
  function applyTheme(){
    var m=MODES.filter(function(x){return x[0]===mode;})[0]||MODES[0];
    root.setAttribute("data-theme",m[0]);
    document.getElementById("tlabel").textContent=m[1];
    document.getElementById("ticon").innerHTML=ICONS[m[0]];
  }
  applyTheme();
  document.getElementById("theme").addEventListener("click",function(){
    var i=MODES.findIndex(function(x){return x[0]===mode;});
    mode=MODES[(i+1)%MODES.length][0];
    try{ localStorage.setItem("ckad-theme",mode); }catch(e){}
    applyTheme();
  });

  /* ---- sidebar filter ---- */
  var q=document.getElementById("q");
  var links=[].slice.call(document.querySelectorAll(".nv"));
  var navGroups=[].slice.call(document.querySelectorAll(".nav-grp"));
  var noresult=document.getElementById("noresult");
  q.addEventListener("input",function(){
    var v=q.value.trim().toLowerCase(), hit=0;
    links.forEach(function(a){
      var ok=!v||a.getAttribute("data-t").indexOf(v)>-1;
      a.hidden=!ok; if(ok) hit++;
    });
    // a group with nothing left to show collapses along with its header
    navGroups.forEach(function(g){
      g.hidden=!!v&&!g.querySelector(".nv:not([hidden])");
    });
    noresult.hidden=hit>0;
  });
  document.addEventListener("keydown",function(e){
    if(e.key==="/"&&document.activeElement!==q&&!/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
      e.preventDefault(); q.focus(); q.select();
    }
    if(e.key==="Escape"){
      if(document.activeElement===q){ q.value=""; q.dispatchEvent(new Event("input")); q.blur(); }
      document.body.classList.remove("nav-open");
    }
  });

  /* ---- scrollspy ---- */
  var secs=[].slice.call(document.querySelectorAll(".sec"));
  var map={}; links.forEach(function(a){ map[a.getAttribute("href").slice(1)]=a; });
  var crumb=document.getElementById("crumb"), docTitle=crumb.textContent, cur=null;
  function spy(){
    var best=null, line=90;
    for(var i=0;i<secs.length;i++){
      var r=secs[i].getBoundingClientRect();
      if(r.top<=line) best=secs[i]; else break;
    }
    if(best===cur) return;
    cur=best;
    links.forEach(function(a){ a.classList.remove("on"); });
    if(best){
      var a=map[best.id];
      if(a){
        a.classList.add("on");
        var h=best.querySelector(".sec-t");
        crumb.innerHTML="";
        crumb.appendChild(document.createTextNode(docTitle+" / "));
        var b=document.createElement("b"); b.textContent=h?h.textContent.trim():""; crumb.appendChild(b);
        var nr=a.getBoundingClientRect(), pr=a.parentNode.getBoundingClientRect();
        if(nr.top<pr.top+8||nr.bottom>pr.bottom-8) a.scrollIntoView({block:"nearest"});
      }
    }else{ crumb.textContent=docTitle; }
  }
  var tick=false;
  window.addEventListener("scroll",function(){
    if(tick) return; tick=true;
    requestAnimationFrame(function(){ spy(); toggleTop(); tick=false; });
  },{passive:true});

  /* ---- copy code ---- */
  document.addEventListener("click",function(e){
    var btn=e.target.closest?e.target.closest(".copy"):null;
    if(!btn) return;
    var txt=btn.closest("figure").querySelector("code").innerText;
    var done=function(){
      var s=btn.querySelector("span"), old=s.textContent;
      s.textContent="已複製"; btn.classList.add("ok");
      setTimeout(function(){ s.textContent=old; btn.classList.remove("ok"); },1400);
    };
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done,fallback);
    }else fallback();
    function fallback(){
      var ta=document.createElement("textarea");
      ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); done(); }catch(err){}
      document.body.removeChild(ta);
    }
  });

  /* ---- mobile nav ---- */
  var menu=document.getElementById("menu");
  menu.addEventListener("click",function(){
    var open=document.body.classList.toggle("nav-open");
    menu.setAttribute("aria-expanded",open?"true":"false");
  });
  document.getElementById("nav").addEventListener("click",function(e){
    if(e.target.closest(".nv")) document.body.classList.remove("nav-open");
  });

  /* ---- back to top ---- */
  var top=document.getElementById("totop");
  function toggleTop(){ top.classList.toggle("on",window.scrollY>600); }
  top.addEventListener("click",function(){
    var rm=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollTo({top:0,behavior:rm?"auto":"smooth"});
  });

  spy(); toggleTop();
})();
</script>
</body>
</html>
